# See:
# - https://learn.chatgpt.com/docs/config-file/config-basic
# - https://learn.chatgpt.com/docs/config-file/config-reference
# - https://developers.openai.com/codex/security
# - https://github.com/openai/codex/blob/main/docs/config.md
model = "gpt-6-sol"
model_reasoning_effort = "medium"

plan_mode_reasoning_effort = "xhigh"
service_tier = "default"
approvals_reviewer = "auto_review"

# The two options below are equivalent to executing as `codex --full-auto`
#
# Default to writeable sandbox
sandbox_mode = "workspace-write"
# Use the permission set "malthe-sandbox"
default_permissions = "malthe-sandbox"
# Sane approval policy
approval_policy = "on-request" # Other options: "untrusted", "never"
# Allow the model to request web searches
web_search = "cached"

[features]
shell_snapshot = true       # Speed up repeated commands
undo = false                # No git ghost commits
multi_agent = true          # New setting in Codex ???

[sandbox_workspace_write]
# Fixes `uv` when running in sandbox (system-configuration / dynamic_store.rs)
# See: https://github.com/openai/codex/issues/5914#issuecomment-3505687500
network_access = true

[tui]
animations = true              # Don't animate text in the TUI (makes it possible to copy/paste login URL)
whimsy = false                 # Remove Astra dots fading in and out (https://github.com/openai/codex/issues/44561)
fullscreen_transcript = false  # Allow tmux to scroll back

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "python3 /Users/malthejorgensen/.codex/notifier.py"

# Create our own sandbox/permissions mode "malthe-sandbox"
#
# See: https://www.codex-docs.com/en/docs/permissions
[permissions.malthe-sandbox]
# By extending the :workspace profile, you get Codex's safeguards to ensure
# subfolders such as .codex/ and .git/ within a workspace root are read-only
# while the rest of the folder is writable.
extends = ":workspace"
[permissions.malthe-sandbox.filesystem]
# By default, deny read access to all files on disk.
":root" = "deny"
# Though in practice, a software agent needs to be able to read folders that
# contain common tools, such as `/usr/bin`, to get work done, so grant access
# to a "minimal" set of files and folders, as determined by Codex.
":minimal" = "read"
# By extending the :workspace profile, :tmpdir and :slash_tmp are "write" by
# default, though you can deny access to them altogether, if desired.
":tmpdir" = "write"
":slash_tmp" = "write"
[permissions.malthe-sandbox.filesystem.":workspace_roots"]
# Generally allow writing inside the project
"." = "write"
# Disallow reading env-files
"**/*.env" = "deny"
"**/*.env.*" = "deny"
# Disallow Malthe's custom .prompts and .plans directories
# (avoids confusion)
".prompts" = "deny"
".plans" = "deny"
[permissions.malthe-sandbox.network]
enabled = true
[permissions.malthe-sandbox.network.domains]
"api.openai.com" = "allow"
"objects.githubusercontent.com" = "allow"
"*.github.com" = "allow"


[mcp_servers.railway]
command = "railway"
args = ["mcp"]

[mcp_servers.railway.tools.list_projects]
approval_mode = "approve"

[mcp_servers.railway.tools.list_services]
approval_mode = "approve"

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp/agentwork"

[mcp_servers.sentry.tools.execute_sentry_tool]
approval_mode = "approve"
