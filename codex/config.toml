# See:
# - https://learn.chatgpt.com/docs/config-file/config-basic
# - https://learn.chatgpt.com/docs/config-file/config-reference
# - https://developers.openai.com/codex/security
# - https://github.com/openai/codex/blob/main/docs/config.md
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

plan_mode_reasoning_effort = "xhigh"
service_tier = "default"
approvals_reviewer = "auto_review"

# The two options below are equivalent to executing as `codex --full-auto`
#
# Default to writeable sandbox
sandbox_mode = "workspace-write"
# [DISABLED] Use the permission set "malthe-sandbox"
# default_permissions = "malthe-sandbox"
# Sane approval policy
approval_policy = "on-request" # Other options: "untrusted", "never"
# Allow the model to request web searches
web_search = "cached"

[features]
shell_snapshot = true       # Speed up repeated commands
undo = false                # No git ghost commits
multi_agent = true          # New setting in Codex ???
network_proxy = true        # Required to enforce the network domain allowlist below.

[sandbox_workspace_write]
# Fixes `uv` when running in sandbox (system-configuration / dynamic_store.rs)
# See: https://github.com/openai/codex/issues/5914#issuecomment-3505687500
network_access = true

[shell_environment_policy.set]
# Give uv a writable location for Python and tool executable links without
# making ~/.local/bin writable. Use absolute paths here; these values are
# environment strings, not filesystem rules with home-directory expansion.
# Invoke these links by absolute path or add this directory to the agent PATH.
UV_PYTHON_BIN_DIR = "/Users/malthejorgensen/.cache/codex-bin"
UV_TOOL_BIN_DIR = "/Users/malthejorgensen/.cache/codex-bin"

# git uses SSH which in turn runs ProxyCommand through $SHELL.
# Use a shell that does not load fish's personal configuration or
# universal-variable state for noninteractive helpers.
SHELL = "/bin/sh"

# `npm` starts `sh` through PATH lookup. A denied PATH directory can
# produce spawn EPERM before it reaches /bin/sh; npm also prepends ancestor
# node_modules/.bin directories. SHELL alone does not control npm script-shell.
npm_config_script_shell = "/bin/sh"

[tui]
animations = true              # Don't animate text in the TUI (makes it possible to copy/paste login URL)
whimsy = false                 # Remove Astra dots fading in and out (https://github.com/openai/codex/issues/44561)
fullscreen_transcript = false  # Allow tmux to scroll back

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "python3 /Users/malthejorgensen/.codex/notifier.py"

# Create our own sandbox/permissions mode "malthe-sandbox"
#
# See: https://www.codex-docs.com/en/docs/permissions
[permissions.malthe-sandbox]
# By extending the :workspace profile, you get Codex's safeguards to ensure
# subfolders such as .codex/ and .git/ within a workspace root are read-only
# while the rest of the folder is writable.
extends = ":workspace"
[permissions.malthe-sandbox.filesystem]
# By default, deny read access to all files on disk.
":root" = "deny"

# Though in practice, a software agent needs to be able to read folders that
# contain common tools, such as `/usr/bin`, to get work done, so grant access
# to a "minimal" set of files and folders, as determined by Codex.
":minimal" = "read"

# By extending the :workspace profile, :tmpdir and :slash_tmp are "write" by
# default, though you can deny access to them altogether, if desired.
":tmpdir" = "write"
":slash_tmp" = "write"

# Installed tools and their libraries, scripts, and SDKs.
"/opt/homebrew" = "read"
"/opt/local" = "read"
"/System/Library/OpenSSL" = "read"
"/Library/Developer/CommandLineTools" = "read"
"~/.local/bin" = "read"
"~/.local/share/mise" = "read"

# Codex's bundled tool runtime.
"~/.cache/codex-runtimes" = "read"

# Built-in skills, plugin skills and their supporting files, and personal skills.
"~/.codex/skills" = "read"
"~/.codex/plugins/cache" = "read"
"~/.agents/skills" = "read"
# Symlinked skills stored elsewhere also need access to their target directory.

# Allow reading git config
"~/.config/git" = "read"
# - the above is a symlink so we need to add the symlink destination:
"~/dotfiles/git/gitconfig" = "read"
"~/dotfiles/git/gitattributes" = "read"
"~/dotfiles/git/gitignore_global" = "read"

# `git fetch` on ssh:// remotes need host verification and configured host/agent settings.
# Keep private keys and the rest of ~/.ssh outside the allowlist. Configuration
# Includes or symlink targets elsewhere need their own exact read permissions.
"~/.ssh/known_hosts" = "read"
"~/.ssh/config" = "read"

# uv package cache, managed Python installations, and tool environments.
"~/.cache/uv" = "write"
"~/.local/share/uv/python" = "write"
"~/.local/share/uv/tools" = "write"
"~/.cache/codex-bin" = "write"

# npm, pnpm, Corepack, and native Node module build caches.
"~/.npm" = "write"
"~/Library/pnpm/store" = "write"
"~/Library/Caches/pnpm" = "write"
"~/Library/Caches/node-gyp" = "write"
"~/.cache/node/corepack" = "write"
# Allow Corepack cache
 "~/.cache/node" = "write"

[permissions.malthe-sandbox.filesystem.":workspace_roots"]
# Generally allow writing inside the project
"." = "write"
# Disallow reading env-files
# - Ideally this would be `**/.env` and `**/env.*`, but those rules will deny Codex from deleting or renmaing _any_ directory in the repo, regardless of whether it contains an `.env`-file.
#   To workaround this we only deny at the root for now.
#   `*/.env` would make it so that directories in the root of the repo can not be renamed or deleted by Codex.
".env" = "deny"
".env.*" = "deny"
# Disallow Malthe's custom .prompts and .plans directories
# (avoids confusion)
".prompts" = "deny"
".plans" = "deny"
# git: Allow commits and rebases
".git" = "write"
# git: Keep the config and hooks as-is (maybe we should open these up to "write" at some point)
".git/config" = "read"
".git/config.worktree" = "read"
".git/hooks" = "read"

[permissions.malthe-sandbox.network]
enabled = true
allow_local_binding = true

[permissions.malthe-sandbox.network.domains]
# Localhost loopback -- to allow dev servers
"localhost" = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"

# OpenAI API.
"api.openai.com" = "allow"

# GitHub repositories, APIs, raw files, and release downloads.
"github.com" = "allow"
"*.github.com" = "allow"
"objects.githubusercontent.com" = "allow"
"release-assets.githubusercontent.com" = "allow"
"raw.githubusercontent.com" = "allow"

# npm and pnpm packages.
"registry.npmjs.org" = "allow"

# Python package index and package downloads.
"pypi.org" = "allow"
"files.pythonhosted.org" = "allow"

# Node headers for native module builds.
"nodejs.org" = "allow"


[mcp_servers.railway]
command = "railway"
args = ["mcp"]

[mcp_servers.railway.tools.list_projects]
approval_mode = "approve"

[mcp_servers.railway.tools.list_services]
approval_mode = "approve"

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp/agentwork"

[mcp_servers.sentry.tools.execute_sentry_tool]
approval_mode = "approve"
